      - During my previous internships I developped skills about programming (C++/Java/Python), numerical methods for fluid dynamics (Real-time methods SPH/FLIP-PIC or Riemann solvers) and put hands on simulating software for diffferent CFD cases (STARCCM+/OpenFOAM).
