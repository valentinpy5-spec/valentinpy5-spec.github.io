          - Engineered a real-time scientific visualization framework within Unreal Engine 5 using Blueprints & Heterogeneous Volumes/Sparse Volume Textures to render aerodynamic criteria (e.g., Q-criterion, velocity fields, streamlines).
          - Developped and explored different numerical methods in C++ for real-time fluid dynamics simulations around NACA0012 airfoil (LBM method through GPU computing).

