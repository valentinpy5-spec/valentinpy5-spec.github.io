  image: ""
  summary: >
    Aerospace engineering student at ISAE-SUPAERO within the Propulsion and Combustion track, I made an exchange
    semester focused on numerical methods for fluid dynamics at the University of Tokyo and followed the M2RI at
    Université Paul Sabatier.
    <br><br>
    During my previous internships I developped skills about programming (C++/Java/Python), numerical methods for
    fluid dynamics (Real-time methods SPH/FLIP-PIC or Riemann solvers) and put hands on simulating software for
    diffferent CFD cases (STARCCM+/OpenFOAM).
    <br><br>
    My goal is to strenghened my knowledge at the intersection between applied mathematics and numerical methods
    for CFD. Driven by rigor and a desire to build next-generation simulation tools, I welcome connections with
    researchers and laboratories in these fields.

