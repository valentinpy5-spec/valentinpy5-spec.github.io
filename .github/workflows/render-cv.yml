name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yaml"
      - "assets/rendercv/design.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          # cv.yaml is the RenderCV-native data file (v2.x format). _data/cv.yml (legacy
          # al_folio_cv format, label/image/summary/address) powers the /cv/ web page
          # separately and must not be picked up here.
          cv_file=_data/cv.yaml
          if [ ! -f "$cv_file" ]; then
            echo "No cv.yaml file found!"
            exit 1
          fi
          design=assets/rendercv/design.yaml
          if [ ! -f "$design" ]; then
            echo "Missing RenderCV design file!"
            exit 1
          fi
          # NOTE: `rendercv render --settings settings.yaml` silently ignores
          # settings.render_command.design/locale in RenderCV 2.8 (upstream bug or path
          # resolution quirk) - it renders with theme defaults instead of failing loudly.
          # Passing --design directly on the CLI is the only path that reliably applies it.
          rendercv render $cv_file --design $design \
            -o assets/rendercv/rendercv_output \
            --dont-generate-markdown --dont-generate-html --dont-generate-png
          mv _data/assets/rendercv/rendercv_output/*.pdf assets/rendercv/rendercv_output/
          rm -rf _data/assets
          rm -f assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: render the latest CV"
          git push
